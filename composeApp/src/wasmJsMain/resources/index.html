<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#19382c">
    <meta name="description" content="Focus Garden — cultive paisagens enquanto mantém o foco.">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon-192.png">
    <title>Focus Garden</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #19382c; }
        body { overscroll-behavior: none; touch-action: manipulation; }
        #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #f6f0e3;
            font: 500 14px system-ui, sans-serif; letter-spacing: .12em; background: #19382c; }
    </style>
</head>
<body>
    <div id="loading">CULTIVANDO O JARDIM…</div>
    <script type="application/javascript">
        if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js'));
        window.addEventListener('DOMContentLoaded', () => setTimeout(() => document.getElementById('loading')?.remove(), 2500));
    </script>
    <script type="application/javascript" src="composeApp.js"></script>
</body>
</html>
